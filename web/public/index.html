<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>All Media</title>

  <!--
    Zum Homescreen hinzugefuegt laeuft die Seite ohne Safari-Leisten ueber den
    ganzen Bildschirm. Ohne diese Angaben bleiben oben die Adresszeile und
    unten die Werkzeugleiste stehen - das ist der Rand, den man sonst sieht.
    "black-translucent" zieht den Inhalt bis unter die Statusleiste; den Platz
    fuer Uhrzeit und Home-Anzeige haelt das CSS ueber env(safe-area-inset-*) frei.
  -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="All Media" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="is-startet">
  <div class="device">
    <div class="app" id="app">
      <!--
        Oben: die Unterpunkte des gerade offenen Bereichs. Der Inhalt wird in
        app.js aus NAV erzeugt, weil er sich je nach Bereich unterscheidet.
      -->
      <header class="topbar" id="topbar"></header>

      <!--
        Das Geruest steht direkt im HTML und nicht im Skript. Nur so ist es
        schon beim allerersten Bildaufbau da - also bevor app.js geladen,
        geparst und ausgefuehrt wurde und bevor /api/bootstrap geantwortet hat.
        Genau in dieser Zeit war der Bildschirm vorher weiss.

        Die Form entspricht der spaeteren Chatliste (Kreis links, zwei Zeilen
        rechts). Ein Geruest, das der echten Liste gleicht, wirkt wie "gleich
        da"; ein Kreisel wirkt wie "warte".

        Dieselbe Struktur erzeugt geruest() in app.js noch einmal - sie wird
        gebraucht, wenn nach einem Fehlschlag erneut geladen wird.
      -->
      <main class="main" id="main">
        <div class="geruest" aria-hidden="true">
          <div class="geruest__stories">
            <div class="skelett geruest__story"></div>
            <div class="skelett geruest__story"></div>
            <div class="skelett geruest__story"></div>
            <div class="skelett geruest__story"></div>
            <div class="skelett geruest__story"></div>
          </div>
          <div class="geruest__suche skelett"></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
          <div class="geruest__zeile"><div class="skelett geruest__kreis"></div><div class="geruest__text"><div class="skelett geruest__balken geruest__balken--kurz"></div><div class="skelett geruest__balken"></div></div></div>
        </div>
      </main>

      <!-- Unten: die vier Bereiche. Diese Struktur ist fest. -->
      <nav class="bottomnav" id="bottomnav"></nav>

      <!-- Vollbild-Ebenen (Chat, Story, Profil, Kamera) -->
      <section class="overlay" id="overlay" hidden></section>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- Offline Indicator — Phase 3 Feature -->
  <div class="offline-indicator" id="offlineIndicator" hidden>
    <div class="offline-icon">⚠️</div>
    <div class="offline-text">Offline — Inhalte werden synchronisiert</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/anmeldung.js"></script>
  <script src="/pull-to-refresh.js"></script>
  <script src="/icons.js"></script>
  <script src="/antworten.js"></script>
  <script src="/app.js"></script>
</body>
</html>
