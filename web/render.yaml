# Achtung: Render liest diese Datei NICHT. Einen Blueprint sucht Render nur in
# der Wurzel des Repos. Der Dienst all-media-website ist im Dashboard
# eingerichtet und baut per Auto-Deploy bei jedem Push auf main. Die Datei
# bleibt als Beschreibung des Dienstes stehen. Ob ein Push live ist,
# prüft im Ordner app/: npm run deploy:pruefen
services:
  - type: web
    name: all-media-website
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Zugang zur Datenbank. Der Schluessel ist der oeffentliche
      # "publishable"-Schluessel — er steckt genauso im App-Bundle. Geschuetzt
      # wird die Datenbank durch ihre Regeln (Row Level Security), nicht durch
      # Geheimhaltung dieses Schluessels.
      - key: SUPABASE_URL
        value: https://ijztosbjfybdgotpdixw.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_sh_LhLSMkHNZrmmj7XkTtw_QFT1G9Ze
